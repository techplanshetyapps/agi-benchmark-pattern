{% load static %}
{% load i18n %}

{% block head %}
    <meta charset="UTF-8">
    <title>{{ empire_title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        #webglCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vw;
            z-index: -1;
            display: block;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }
        h1, h2 { color: #38bdf8; }
        .card { background: rgba(51, 65, 85, 0.9); padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; box-sizing: border-box; }

        /* Date input container styling to make the whole wrapper clickable and position the calendar icon */
        .date-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 4px;
            margin-top: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .date-input-wrapper input[type="date"] {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
            cursor: pointer;
        }
        .date-input-wrapper input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .date-input-wrapper .bi-calendar {
            position: absolute;
            right: 12px;
            color: #94a3b8;
            pointer-events: none;
        }

        .range-container { display: flex; align-items: center; gap: 10px; }
        .range-container input[type="range"] { flex: 1; margin: 0; }
        .date-row { display: flex; gap: 10px; }
        .date-col { flex: 1; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; }
        button:hover { background: #0ea5e9; }
        pre { background: #0f172a; padding: 10px; overflow-x: auto; color: #34d399; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
{% endblock %}
{% block body %}

<canvas id="webglCanvas"></canvas>

<div class="container">
    {% block content %}
    <h1>{{ empire_title }}</h1>
    <p><em>{{ system_version }}</em></p>
    <hr>

    <div class="card">
        <h2>AI Travel Concierge Action Board</h2>
        <form id="conciergeForm">
            <label for="destination">Destination Country:</label>
            <select id="destination" required>
                <option value="">-- Select Country --</option>
                <option value="Japan">Japan</option>
                <option value="France">France</option>
                <option value="Italy">Italy</option>
                <option value="Spain">Spain</option>
                <option value="Thailand">Thailand</option>
                <option value="Costa Rica">Costa Rica</option>
                <option value="Australia">Australia</option>
                <option value="Canada">Canada</option>
                <option value="Switzerland">Switzerland</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="United States">United States</option>
            </select>

            <label for="budget">Budget ($1,500 - $3,500): <span id="budgetValue" style="color: #38bdf8; font-weight: bold;">$2500</span></label>
            <div class="range-container">
                <input type="range" id="budget" min="1500" max="3500" step="50" value="2500" oninput="document.getElementById('budgetValue').innerText = '$' + this.value">
            </div>

            <div class="date-row">
                <div class="date-col">
                    <label for="startDate">Start Date:</label>
                    <div class="date-input-wrapper" onclick="document.getElementById('startDate').showPicker()">
                        <input type="date" id="startDate" required>
                        <i class="bi bi-calendar"></i>
                    </div>
                </div>
                <div class="date-col">
                    <label for="endDate">End Date:</label>
                    <div class="date-input-wrapper" onclick="document.getElementById('endDate').showPicker()">
                        <input type="date" id="endDate" required>
                        <i class="bi bi-calendar"></i>
                    </div>
                </div>
            </div>

            <label for="interests">Interests:</label>
            <textarea id="interests" placeholder="Cybernetics, Ramen shops, Hidden alleys" rows="3"></textarea>

            <button type="button" onclick="planTrip()">Generate Real-Time Itinerary</button>
        </form>
        <div id="tripResult" style="margin-top:15px;"></div>
    </div>

    <div class="card">
        <h2>ARC-AGI-1 Task Generation Runner</h2>
        <button type="button" onclick="runTaskGen()">Execute Task Generator Script</button>
        <pre id="genLogs">Awaiting execution logs...</pre>
    </div>
    {% endblock %}
</div>

<script>
async function planTrip() {
    const payload = {
        destination: document.getElementById('destination').value,
        budget: document.getElementById('budget').value,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        interests: document.getElementById('interests').value
    };

    if (!payload.destination || !payload.start_date || !payload.end_date) {
        alert("Please fill in all required fields (Destination, Start Date, End Date).");
        return;
    }

    document.getElementById('tripResult').innerHTML = "Generating optimization & lowest cost matrix...";
    let res = await fetch('/api/concierge/plan/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    let data = await res.json();
    if(data.status === 'success') {
        document.getElementById('tripResult').innerHTML = `<h3>Itinerary Loaded</h3><pre>${data.itinerary}</pre>`;
    } else {
        document.getElementById('tripResult').innerHTML = `<p style="color:red">Error: ${data.message}</p>`;
    }
}

async function runTaskGen() {
    document.getElementById('genLogs').innerText = "Running arc-task-gen subprocess via Django backend...";
    let res = await fetch('/api/generate-task/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({stratified: false, n: 2})
    });
    let data = await res.json();
    document.getElementById('genLogs').innerText = JSON.stringify(data, null, 2);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('webglCanvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 20000);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const sphereGeometry = new THREE.SphereGeometry(5000, 60, 40);
sphereGeometry.scale(-1, 1, 1);

const textureLoader = new THREE.TextureLoader();
const texture = textureLoader.load("{{ sky_image_url }}");
texture.wrapS = THREE.RepeatWrapping;
texture.wrapT = THREE.ClampToEdgeWrapping;

const sphereMaterial = new THREE.MeshBasicMaterial({ map: texture });
const sphereMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
scene.add(sphereMesh);

const zodiacGroup = new THREE.Group();
scene.add(zodiacGroup);

function createConstellation(pointsArray, offsetX, offsetY, offsetZ, scale = 1) {
    const points = pointsArray.map(p => new THREE.Vector3(p[0] * scale, p[1] * scale, p[2] * scale));
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        linewidth: 2,
        transparent: true,
        opacity: 0.75,
        depthWrite: false
    });
    const line = new THREE.Line(geometry, material);
    line.position.set(offsetX, offsetY, offsetZ);
    zodiacGroup.add(line);

    const starGeo = new THREE.BufferGeometry().setFromPoints(points);
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 8, transparent: true, depthWrite: false });
    const stars = new THREE.Points(starGeo, starMat);
    stars.position.set(offsetX, offsetY, offsetZ);
    zodiacGroup.add(stars);
}

createConstellation([[0,10,0], [5,8,2], [10,2,4], [12,-5,2], [8,-10,0], [4,-8,-2], [0,-5,0]], -1200, 500, -2000, 12);
createConstellation([[-10,5,-5], [-5,2,-2], [0,0,0], [5,2,2], [10,6,5], [5,10,2], [0,0,0], [0,-8,-2]], 1400, 800, -1800, 10);
createConstellation([[-8,10,0], [-8,-10,0], [-4,-10,0], [-4,10,0], [4,10,0], [4,-10,0], [8,-10,0], [8,10,0]], 0, 1000, -2200, 9);
createConstellation([[10,8,0], [6,10,2], [0,8,4], [-5,4,2], [-8,0,0], [-6,-6,-2], [0,-10,0], [6,-8,2], [10,-4,4]], -1500, -400, -1800, 11);
createConstellation([[-10,10,0], [-8,4,0], [-6,-2,0], [-4,-8,0], [0,-10,2], [6,-8,4], [8,-2,2], [4,2,0], [8,6,2]], 1300, -600, -2000, 11);
createConstellation([[0,12,0], [6,6,2], [10,-4,4], [4,-10,0], [-4,-10,0], [-10,-4,4], [-6,6,2]], 1800, 200, 1200, 12);
createConstellation([[10,10,0], [4,6,0], [-4,6,0], [-10,10,0], [-6,0,0], [-10,-10,0], [-4,-6,0], [4,-6,0], [10,-10,0], [6,0,0]], -1800, 300, 1500, 10);
createConstellation([[0,10,0], [-6,6,2], [-10,0,0], [-6,-6,-2], [0,-10,0], [6,-6,-2], [10,0,0], [6,6,2]], 0, -1200, -1900, 10);

let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

document.addEventListener('mousemove', (event) => {
    mouseX = event.clientX - (window.innerWidth / 2);
    mouseY = event.clientY - (window.innerHeight / 2);
});

function animate() {
    requestAnimationFrame(animate);

    targetX += (mouseX - targetX) * 0.05;
    targetY += (mouseY - targetY) * 0.05;

    zodiacGroup.rotation.y = targetX * 0.0004;
    zodiacGroup.rotation.x = targetY * 0.0004;
    zodiacGroup.rotation.y += 0.0002;

    sphereMesh.rotation.y += 0.001;

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
{% endblock %}
